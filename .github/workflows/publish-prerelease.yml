name: Publish Pre-Release to VS Marketplace

on:
  workflow_dispatch:

jobs:
  build-and-publish-prerelease:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Test Extension
        run: npm test

      - name: Lint Extension
        run: npm run lint

      - name: Package Pre-Release
        run: npx @vscode/vsce package --pre-release --no-dependencies

      - name: Resolve Package Path
        run: echo "VSIX_PATH=vertex-ai-models-chat-provider-$(node -p \"require('./package.json').version\").vsix" >> "$GITHUB_ENV"

      - name: Verify Pre-Release Manifest
        run: unzip -p "$VSIX_PATH" extension.vsixmanifest | grep -q 'Microsoft.VisualStudio.Code.PreRelease" Value="true'

      - name: Publish Pre-Release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --pre-release --packagePath "$VSIX_PATH" -p "$VSCE_PAT"
