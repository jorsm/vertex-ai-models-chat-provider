name: Publish to VS Marketplace

# Only trigger this workflow when a new tag is pushed that starts with 'v' (e.g., v1.0.0).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Tag to publish (for example, v0.6.4)"
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      # Lock the build to a LTS Node version and caches NPM modules to make the pipeline run faster.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Strict Installation: 'npm ci' (clean install) is safer than 'npm i' for CI/CD.
      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Install Marketplace Publisher
        run: npm install --no-save --package-lock=false @vscode/vsce@4.0.0

      # The Marketplace client defaults uploads to three minutes and has no CLI timeout option.
      - name: Extend Marketplace Upload Timeout
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const packagePath = require.resolve('@vscode/vsce/package.json');
          const utilPath = path.join(path.dirname(packagePath), 'out', 'util.js');
          const source = fs.readFileSync(utilPath, 'utf8');
          const original = 'new GalleryApi_1.GalleryApi(marketplaceUrl, [authHandler]);';
          const replacement = 'new GalleryApi_1.GalleryApi(marketplaceUrl, [authHandler], { socketTimeout: 15 * 60 * 1000 });';

          if (source.split(original).length !== 2) {
            throw new Error('Could not locate the Marketplace GalleryApi constructor');
          }

          fs.writeFileSync(utilPath, source.replace(original, replacement));
          NODE

      - name: Publish to Marketplace
        run: npx --no-install vsce publish -p ${{ secrets.VSCE_PAT }}
